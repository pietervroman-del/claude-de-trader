name: Handelsronde

# Speelt om 07:30, 12:00, 18:00 en 23:00 Belgische tijd een papertrading-ronde met Claude,
# pusht het resultaat en meldt trades via ntfy.
# Cron loopt in UTC, dus staan zowel de winter- als de zomertijden erin; de job "uur" laat er telkens maar één door.
on:
  schedule:
    - cron: "30 6 * * *"         # winter (UTC+1): 07:30
    - cron: "0 11,17,22 * * *"   # winter (UTC+1): 12:00, 18:00, 23:00
    - cron: "30 5 * * *"         # zomer (UTC+2): 07:30
    - cron: "0 10,16,21 * * *"   # zomer (UTC+2): 12:00, 18:00, 23:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  uur:
    runs-on: ubuntu-latest
    outputs:
      spelen: ${{ steps.check.outputs.spelen }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=Europe/Brussels date +%z)
          case "$SCHEDULE" in
            "") SPELEN=true ;;                                   # handmatig gestart
            "30 6 * * *"|"0 11,17,22 * * *") [ "$OFFSET" = "+0100" ] && SPELEN=true || SPELEN=false ;;
            "30 5 * * *"|"0 10,16,21 * * *") [ "$OFFSET" = "+0200" ] && SPELEN=true || SPELEN=false ;;
            *) SPELEN=false ;;
          esac
          echo "schema '$SCHEDULE', Brussel $OFFSET -> spelen=$SPELEN"
          echo "spelen=$SPELEN" >> "$GITHUB_OUTPUT"

  ronde:
    needs: uur
    if: needs.uur.outputs.spelen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code installeren
        run: npm install -g @anthropic-ai/claude-code

      - name: Ronde spelen
        env:
          # een van beide volstaat: een API-sleutel, of een token van je Claude-abonnement (claude setup-token)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ROUNDS=$(python3 -c 'import json;print(len(json.load(open("data/state.json"))["rounds"]))')" >> "$GITHUB_ENV"
          claude -p "$(cat .github/ronde-prompt.md)" \
            --model claude-sonnet-5-5 \
            --max-turns 30 \
            --allowedTools "Bash(python3 trader.py:*)" "Read" "Grep" "Glob"

      - name: Controleren dat er een ronde bij kwam
        run: |
          NOW=$(python3 -c 'import json;print(len(json.load(open("data/state.json"))["rounds"]))')
          echo "rondes: $ROUNDS -> $NOW"
          test "$NOW" -gt "$ROUNDS"

      - name: Commit en push
        run: |
          git config user.name "Claude de Trader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG=$(python3 -c 'import json;n=json.load(open("data/state.json"))["rounds"][-1]["note"];print(n.split(". ")[0][:100])')
          git add data/state.json docs/data.json
          git commit -m "$MSG"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

      - name: Melding bij trade
        if: env.NTFY_TOPIC != ''
        run: python3 notify.py "$BEFORE" "$NTFY_TOPIC"
